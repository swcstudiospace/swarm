# mypy configuration for swarm/ (Phase 11, U3).
#
# Policy: strict over the whole package. There are no per-module relaxations and no blanket
# suppressions. Running `mypy` from the repository root is the gate, and it must exit 0.
[mypy]
strict = True
python_version = 3.12
files = swarm

# Optional third-party import: swarm/envelope.py imports cryptography lazily inside a try block
# (Ed25519 signing). The package is not a declared dependency, so a plain typecheck environment
# does not have it. The envelope code is typed through Protocols that do not need the package.
[mypy-cryptography.*]
ignore_missing_imports = True
