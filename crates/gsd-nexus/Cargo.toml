[package]
name = "gsd-nexus"
version = "0.1.0"
edition = "2021"
description = "Nexus Coordinator for GSD-Core: pub/sub, request/response, shared memory CRDT, broadcast"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swcstudiospace/agent-swarm"
categories = ["concurrency", "distributed-systems", "crdt", "pubsub"]
keywords = ["nexus", "crdt", "pubsub", "coordination", "shared-memory"]

[dev-dependencies]
tokio = { workspace = true }
tokio-test = "0.4"
proptest = "1.2"
tempfile = { workspace = true }
