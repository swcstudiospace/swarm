[package]
name = "gsd-observability"
version = "0.1.0"
edition = "2021"
description = "Observability Stack for GSD-Core: structured logging, distributed tracing, metrics, replay/debugging"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swcstudiospace/agent-swarm"
categories = ["monitoring", "logging", "tracing", "metrics", "development-tools"]
keywords = ["observability", "tracing", "metrics", "logging", "replay", "debugging"]

[dependencies]
tokio = { workspace = true }
gsd-runtime = { path = "../gsd-runtime" }
gsd-proto = { path = "../gsd-proto" }
gsd-serde = { path = "../gsd-serde" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
crossbeam = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = "0.4"
proptest = "1.2"
tempfile = { workspace = true }