[package]
name = "gsd-python"
version = "0.1.0"
edition = "2021"
description = "PyO3 extension module swarm._native: the Rust error codes, retry policy, orch_status wire and opt-in redaction span scanner for the Python package"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swcstudiospace/agent-swarm"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin for the wheel (U2). Off by default so `cargo test` links against libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { workspace = true }
gsd-codes = { path = "../gsd-codes" }
gsd-failure = { path = "../gsd-failure" }
gsd-route = { path = "../gsd-route" }
gsd-redact = { path = "../gsd-redact" }
