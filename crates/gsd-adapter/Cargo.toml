[package]
name = "gsd-adapter"
version = "0.1.0"
edition = "2021"
description = "Legacy Adapter for GSD-Core: zero-code migration layer for existing subagents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swcstudiospace/agent-swarm"
categories = ["development-tools", "migration", "adapter"]
keywords = ["adapter", "migration", "legacy", "subagent"]

[features]
# The sandbox backend serves `orch_status --transition` from the write-enabled guest (phase 14.5, pin P1): the nested guest is built
# with its `write-routes` feature and the binary embeds it. Off until the pin commit; off, a write call on the sandbox backend is
# refused before any write (E-DEP, write_state not_started) and the guest bytes and their pin are the default ones.
sandbox-write = ["gsd-sandbox/write-routes"]

[dependencies]
gsd-proto = { path = "../gsd-proto" }
gsd-runtime = { path = "../gsd-runtime" }
gsd-serde = { path = "../gsd-serde" }
gsd-failure = { path = "../gsd-failure" }
gsd-scheduler = { path = "../gsd-scheduler" }
gsd-state = { path = "../gsd-state" }
gsd-pool = { path = "../gsd-pool" }
gsd-governor = { path = "../gsd-governor" }
gsd-route = { path = "../gsd-route" }
gsd-sandbox = { path = "../gsd-sandbox" }
gsd-sdk = { path = "../gsd-sdk" }
gsd-taskwriter = { path = "../gsd-taskwriter" }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = "0.4"
proptest = "1.2"
tempfile = { workspace = true }