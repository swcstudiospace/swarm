[package]
name = "gsd-serde"
version = "0.1.0"
edition = "2021"
description = "Serialization layer for GSD-Core: prost-reflect + bincode for checkpoint/artifact persistence"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swcstudiospace/agent-swarm"
categories = ["serialization", "data-structures", "development-tools"]
keywords = ["bincode", "prost", "serialization", "checkpoint", "replay"]

[dependencies]
prost = { workspace = true, features = ["derive", "std"] }
prost-types = { workspace = true }
prost-reflect = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }

[dev-dependencies]
proptest = "1.2"
gsd-proto = { path = "../gsd-proto" }