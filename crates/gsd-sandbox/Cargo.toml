[package]
name = "gsd-sandbox"
version = "0.1.0"
edition = "2021"
description = "Wasmtime sandbox host for the GSD-Core guest: module identity, loading, limits and the typed invoke boundary"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swcstudiospace/agent-swarm"

[features]
# Builds the nested guest with its `write-routes-2` feature (the transition decision and the second batch of modes: Phase 14.5 pin
# P2) and pins it with `guest-module-write.sha256` instead of `guest-module.sha256`. Off, nothing about the guest, its digest or its pin
# changes.
write-routes = []

[dependencies]
gsd-failure = { path = "../gsd-failure" }
gsd-route = { path = "../gsd-route" }
gsd-security = { path = "../gsd-security" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
wasmtime = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }
wit-component = "=0.247.0"

[dev-dependencies]
wat = "1.262"
