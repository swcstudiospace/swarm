name: wheel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install maturin
        run: python3 -m pip install maturin==1.15.0
      - name: install mypy
        run: python3 -m pip install mypy==1.18.2
      - name: mypy (strict, repo config)
        run: mypy --cache-dir "$RUNNER_TEMP/mypy-cache"
      - name: install pinned Rust toolchain for the manylinux build
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - name: build abi3-py312 manylinux_2_28 x86_64 wheel
        run: scripts/ci_build_wheel.sh dist
      - name: upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: agent-swarm-wheel-cp312-abi3-manylinux_2_28_x86_64
          path: dist/*.whl
          if-no-files-found: error
      - name: upload the parity suite for the installed-wheel gate
        uses: actions/upload-artifact@v4
        with:
          name: agent-swarm-parity-suite
          path: |
            tests/parity/test_extension_parity.py
            tests/parity/test_extension_threads.py
            scripts/orch_status.py
          if-no-files-found: error

  install-and-gate:
    needs: wheel
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-swarm-wheel-cp312-abi3-manylinux_2_28_x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: agent-swarm-parity-suite
          path: /tmp/gate
      - name: install wheel and mypy into the clean container
        run: python -m pip install --no-cache-dir dist/*.whl mypy==1.18.2
      # Gates run from /tmp, outside the repository, so the installed wheel is checked, not the source tree.
      - name: import gate
        run: |
          cd /tmp
          python -c "import swarm._native"
      - name: stubtest gate
        run: |
          cd /tmp
          python -m mypy.stubtest swarm._native
      - name: install pytest into the clean container
        run: python -m pip install --no-cache-dir pytest==9.1.1
      # U5 parity gate, run from /tmp/gate: the parity tests and the orch_status script, but no swarm/
      # package, so every swarm import resolves to the installed wheel.
      - name: U5 parity gate (installed wheel)
        run: |
          cd /tmp/gate
          python -m pytest -o addopts="" -q tests/parity/test_extension_parity.py tests/parity/test_extension_threads.py
