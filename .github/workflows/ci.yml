name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every job runs on a GitHub-hosted runner (ubuntu-24.04). The repository is public, so hosted
    # standard runners are free. The fork-PR condition on each job below is unchanged.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # The full suite takes about 65-70 minutes (64 min on GitHub-hosted, 69 min on the old pool). Bound it well
    # above that, so a stuck test fails the job instead of holding a runner for GitHub's 6-hour default.
    timeout-minutes: 120
    # Tooling and the omp suite import swarm; wheel.yml builds and gates the native extension.
    env:
      SWARM_PURE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      # A plain `pip install` can fall back to the user site
      # (~/.local). tests/conftest.py points HOME at a temp dir for every test, so the scripts the tests
      # spawn with sys.executable could not see pytest, PyYAML or cryptography there (149 failures on main).
      # A venv keeps the packages next to the interpreter, whatever HOME is.
      - name: install test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install pytest ruff pyyaml cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      # The tests call cargo (cargo metadata --offline). The pool had a populated registry; a hosted runner starts empty.
      - name: cargo registry (locked)
        run: cargo fetch --locked
      - name: ruff
        run: ruff check .
      - name: pytest
        # Native-only scheduler modules import swarm._native, which this pure-Python job does not build.
        # Collection errors are reported, not hidden: the job stays red until those modules run in a native job.
        run: python3 -m pytest --continue-on-collection-errors
      - name: build_agents check
        run: python3 scripts/build_agents.py --check
      - name: pin hash
        run: python3 scripts/_check_pins.py
      - name: tool registry
        run: python3 -m swarm.tool_registry check
      - name: tool docs drift
        run: python3 -m swarm.tool_registry docs --check
      - name: tool contract tests drift
        run: python3 -m swarm.tool_registry gen-tests --check
      - name: skill registry
        run: python3 -m swarm.skill_registry check
      - name: skill docs drift
        run: python3 -m swarm.skill_registry docs --check
      - name: registry intake dry check
        run: python3 scripts/_registry_intake.py --check
      - name: root TS suite
        run: bun test tests/ts
      - name: omp package suite
        working-directory: omp
        run: bun run test
  # The Rust jobs below build cold on the runner: a debug gsd_engine is about 450 MB, too large to hand between jobs, so each one has the
  # full 120 minutes. They need Python 3.12 with a shared libpython (pyo3 runs the interpreter in its build script and `cargo test`
  # links it). scripts/ci_rust_toolchain.sh installs the toolchain pinned in rust-toolchain.toml.
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      # gsd-proto's build script runs prost-build, which needs protoc. The Omega pool had it installed; a hosted image does not.
      - name: protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version
      # cargo metadata --offline (the key tests) needs every crate in the lockfile, including those for other targets, so fetch them all first.
      - name: cargo registry (locked)
        run: cargo fetch --locked
      - name: Build (locked)
        run: cargo build --workspace --locked
      # The signing-key tests (phase 14.5, unit U3.4e) run the real debug binary, so they run here and not in the `test` job, which
      # has no cargo build. Under CI a missing binary or one older than the Rust sources FAILS the tests instead of skipping them.
      # Python comes as in the `test` job: a venv beside the interpreter, the same as there.
      - name: key tests - Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install pytest pyyaml cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # The default build: the sandbox write legs check the named E-DEP refusal and report "not covered", never a pass.
      - name: key tests (default build)
        env:
          SWARM_PURE_PYTHON: "1"
          GSD_ENGINE_BUILD: default
        run: |
          cp -p target/debug/gsd_engine "$RUNNER_TEMP/gsd_engine-default"
          GSD_ENGINE_BIN="$RUNNER_TEMP/gsd_engine-default" python3 -m pytest tests/test_keys_never_in_guest.py -p no:cacheprovider --junitxml="$RUNNER_TEMP/keys-default.xml"
      # The transition matrix and the signed APPROVED cells (phase 14.5, unit U3.4d) run the real binary through the selector and alone and
      # compare every byte with the Python script. Under CI a job that names its binary or build makes them FAIL instead of skipping. The
      # selector legs run the Python body without SWARM_PURE_PYTHON, so `swarm._native` must import: it is built here, the way
      # scripts/ci_parity_rust.sh builds it, only when it does not.
      - name: parity cells - swarm._native
        run: |
          if ! python3 -c 'import swarm._native' >/dev/null 2>&1; then
            "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "maturin==1.15.0"
            VIRTUAL_ENV="$RUNNER_TEMP/venv" "$RUNNER_TEMP/venv/bin/maturin" develop --locked
          fi
      - name: transition and signed parity cells (default build, host backend)
        env:
          GSD_ENGINE_BUILD: default
        run: GSD_ENGINE_BIN="$RUNNER_TEMP/gsd_engine-default" python3 -m pytest tests/parity/test_write_parity.py -p no:cacheprovider
      # The write guest embedded in the sandbox crate imports nothing (the check derives the manifest from the bytes: no pin needed).
      - name: guest imports (write guest)
        run: cargo test -p gsd-sandbox --features write-routes --test guest_imports --locked
      # The sandbox-write build: the guest serves the transition (no failover notice), which the default build cannot show.
      - name: key tests (sandbox-write build)
        env:
          SWARM_PURE_PYTHON: "1"
          GSD_ENGINE_BUILD: sandbox-write
        run: |
          cargo build -p gsd-adapter --bin gsd_engine --features sandbox-write --locked
          cp -p target/debug/gsd_engine "$RUNNER_TEMP/gsd_engine-write"
          GSD_ENGINE_BIN="$RUNNER_TEMP/gsd_engine-write" python3 -m pytest tests/test_keys_never_in_guest.py -p no:cacheprovider --junitxml="$RUNNER_TEMP/keys-write.xml"
      # The same cells on the sandbox backend: only this build serves them in the guest, every other build refuses and Python answers.
      - name: transition and signed parity cells (sandbox-write build, sandbox backend)
        env:
          GSD_ENGINE_BUILD: sandbox-write
          GSD_PARITY_BACKEND: sandbox
        run: GSD_ENGINE_BIN="$RUNNER_TEMP/gsd_engine-write" python3 -m pytest tests/parity/test_write_parity.py -p no:cacheprovider
      # What the Rust gate-issue tail signs verifies in Python, and no key reaches an output (unit U3.6a). The example is built here;
      # GSD_ENGINE_BUILD names the job's build so that a missing example FAILS under CI instead of skipping.
      - name: gate signing keys (gate_issue_apply example)
        env:
          SWARM_PURE_PYTHON: "1"
          GSD_ENGINE_BUILD: default
        run: |
          cargo build -p gsd-taskwriter --example gate_issue_apply --locked
          python3 -m pytest tests/test_gate_signing_keys.py -p no:cacheprovider
      - name: upload the key test reports (they record the build under test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-test-reports
          path: |
            ${{ runner.temp }}/keys-default.xml
            ${{ runner.temp }}/keys-write.xml
          if-no-files-found: ignore
      - name: Test (locked)
        run: cargo test --workspace --locked --no-fail-fast
      # The suites behind a Cargo feature, which the workspace run above does not enable: the writer's fault-injection points (phase
      # 14.5, unit U3.2d) and the sandbox backend's write guest (U3.3b).
      - name: Test (fault-injection, sandbox-write)
        run: |
          cargo test -p gsd-taskwriter --features fault-injection --locked --no-fail-fast
          cargo test -p gsd-adapter --features sandbox-write --locked --no-fail-fast
      # The selector and the real binary under races, kill -9 and a lost reply (U3.2d). The default build serves the host backend,
      # which is what the suite exercises; it uses the debug binary the key tests copied aside.
      - name: write fault suite (Python, default build)
        env:
          SWARM_PURE_PYTHON: "1"
        run: GSD_ENGINE_BIN="$RUNNER_TEMP/gsd_engine-default" python3 -m pytest tests/test_write_faults.py -p no:cacheprovider
  clippy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      # gsd-proto's build script runs prost-build, which needs protoc. The Omega pool had it installed; a hosted image does not.
      - name: protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  parity-rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      # gsd-proto's build script runs prost-build, which needs protoc. The Omega pool had it installed; a hosted image does not.
      - name: protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version
      - name: parity gate (Python and Rust legs, fault tests, budget record)
        run: scripts/ci_parity_rust.sh parity-out
      - name: upload the parity records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-out
          path: parity-out/
          if-no-files-found: ignore
  # The scheduler gate (phase 14.4, unit 14): scripts/ci_scheduler_rust.sh runs the native scheduler legs fail-closed on RELEASE builds
  # (the plan's release rule) and writes its reports to scheduler-out/. Every leg's children must be witnessed on that leg's engine.
  scheduler:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      # gsd-proto's build script runs prost-build, which needs protoc. The Omega pool had it installed; a hosted image does not.
      - name: protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version
      # The packages go into a venv beside the interpreter (see the `test` job).
      - name: Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install pytest pyyaml cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: scheduler gate (native build, binding, threads, vectors, both engines, types, clippy)
        env:
          SCHEDULER_CONTINUOUS_SHA256: ${{ vars.SCHEDULER_CONTINUOUS_SHA256 }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "maturin==1.15.0" "mypy==1.18.2"
          if ! python3 -c 'import swarm._native' >/dev/null 2>&1; then
            VIRTUAL_ENV="$RUNNER_TEMP/venv" "$RUNNER_TEMP/venv/bin/maturin" develop --release --locked
          fi
          cargo build -p gsd-adapter --bin gsd_engine --release --locked
          target_dir="$(cargo metadata --format-version 1 --no-deps --locked | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')"
          GSD_ENGINE_BIN="$target_dir/release/gsd_engine" scripts/ci_scheduler_rust.sh scheduler-out
      - name: upload the scheduler reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-out
          path: scheduler-out/
          if-no-files-found: ignore
  # Headless Chrome against the cross-origin-isolation headers and the SharedArrayBuffer vectors (tests/acceptance/*.mjs). Chrome must
  # exist on the runner image; without it scripts/_ci_browser_gate.py exits 3 and says so. The repository variable BROWSER_GATE=skip
  # turns the job off without a code change.
  browser:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.BROWSER_GATE != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install web dependencies (no lifecycle scripts)
        working-directory: web
        run: npm ci --ignore-scripts
      - name: browser acceptance
        run: python3 scripts/_ci_browser_gate.py
  supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      - name: cargo-deny (advisories, bans, licenses, sources)
        run: scripts/ci_cargo_deny.sh deny-report.txt
      - name: upload the cargo-deny report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-deny-report
          path: deny-report.txt
          if-no-files-found: ignore
