name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every job runs on the Omega CI runner pool, never on GitHub-hosted runners
    # (docs: swcstudiospace/Omega-Prime docs/ci-runners.md). Fork pull requests are
    # skipped instead of queuing: the pool only takes this organisation's own code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    # The full suite takes about 65-70 minutes (64 min on GitHub-hosted, 69 min on the pool). Bound it well
    # above that, so a stuck test fails the job instead of holding a pool slot for GitHub's 6-hour default.
    timeout-minutes: 120
    # Tooling and the omp suite import swarm; wheel.yml builds and gates the native extension.
    env:
      SWARM_PURE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      # The pool's tool cache is read-only, so a plain `pip install` falls back to the user site
      # (~/.local). tests/conftest.py points HOME at a temp dir for every test, so the scripts the tests
      # spawn with sys.executable could not see pytest, PyYAML or cryptography there (149 failures on main).
      # A venv keeps the packages next to the interpreter, whatever HOME is.
      - name: install test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install pytest ruff pyyaml cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python3 -m pytest
      - name: build_agents check
        run: python3 scripts/build_agents.py --check
      - name: pin hash
        run: python3 scripts/_check_pins.py
      - name: tool registry
        run: python3 -m swarm.tool_registry check
      - name: tool docs drift
        run: python3 -m swarm.tool_registry docs --check
      - name: tool contract tests drift
        run: python3 -m swarm.tool_registry gen-tests --check
      - name: skill registry
        run: python3 -m swarm.skill_registry check
      - name: skill docs drift
        run: python3 -m swarm.skill_registry docs --check
      - name: registry intake dry check
        run: python3 scripts/_registry_intake.py --check
      - name: root TS suite
        run: bun test tests/ts
      - name: omp package suite
        working-directory: omp
        run: bun run test
  # The Rust jobs below build cold on the pool: a debug gsd_engine is about 450 MB, too large to hand between jobs, so each one has the
  # full 120 minutes. They need Python 3.12 with a shared libpython (pyo3 runs the interpreter in its build script and `cargo test`
  # links it). scripts/ci_rust_toolchain.sh installs the toolchain pinned in rust-toolchain.toml.
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      - name: Build (locked)
        run: cargo build --workspace --locked
      - name: Test (locked)
        run: cargo test --workspace --locked --no-fail-fast
  clippy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  parity-rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      - name: parity gate (Python and Rust legs, fault tests, budget record)
        run: scripts/ci_parity_rust.sh parity-out
      - name: upload the parity records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-out
          path: parity-out/
          if-no-files-found: ignore
  # Headless Chrome against the cross-origin-isolation headers and the SharedArrayBuffer vectors (tests/acceptance/*.mjs). Chrome must
  # exist on the runner image; without it scripts/_ci_browser_gate.py exits 3 and says so. The repository variable BROWSER_GATE=skip
  # turns the job off without a code change.
  browser:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.BROWSER_GATE != 'skip'
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install web dependencies (no lifecycle scripts)
        working-directory: web
        run: npm ci --ignore-scripts
      - name: browser acceptance
        run: python3 scripts/_ci_browser_gate.py
  supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: host facts
        run: scripts/ci_host_facts.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pinned Rust toolchain
        run: scripts/ci_rust_toolchain.sh
      - name: cargo-deny (advisories, bans, licenses, sources)
        run: scripts/ci_cargo_deny.sh deny-report.txt
      - name: upload the cargo-deny report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-deny-report
          path: deny-report.txt
          if-no-files-found: ignore
