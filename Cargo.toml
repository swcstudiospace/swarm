[workspace]
resolver = "2"
members = [
    "crates/gsd-runtime",
    "crates/gsd-proto",
    "crates/gsd-serde",
    "crates/gsd-pool",
    "crates/gsd-scheduler",
    "crates/gsd-governor",
    "crates/gsd-observability",
    "crates/gsd-security",
    "crates/gsd-nexus",
    "crates/gsd-failure",
    "crates/gsd-state",
    "crates/gsd-adapter",
    "crates/gsd-sandbox",
    "crates/gsd-route",
    "crates/gsd-codes",
    "crates/gsd-guest",
    "crates/gsd-sdk",
    "crates/gsd-python",
    "crates/gsd-redact",
    "crates/gsd-sched-core",
    "crates/gsd-envelope",
]
# ipc is used by no member and has an incomplete module tree (its owning phase re-adds it); cli has an invalid manifest.
exclude = ["crates/gsd-ipc", "crates/gsd-cli"]

[workspace.dependencies]
pyo3 = { version = "0.30.1", default-features = false, features = ["abi3-py312", "macros"] }
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros", "io-util", "net", "time", "sync", "fs", "process", "signal"] }
tokio-uring = "0.5"
tonic = { version = "0.12", features = ["tls", "transport", "codegen"] }
prost = { version = "0.13", features = ["derive", "std"] }
prost-types = "0.13"
prost-reflect = "0.13"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.6"
thiserror = "2.0"
anyhow = "1.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.13"
opentelemetry = { version = "0.33", features = ["trace", "metrics", "logs"] }
opentelemetry-sdk = { package = "opentelemetry_sdk", version = "0.33", features = ["trace", "metrics", "logs", "rt-tokio-current-thread"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "http-proto"] }
uuid = { version = "1.12", features = ["v4", "v7", "serde", "fast-rng"] }
ulid = { version = "3.0", features = ["serde", "uuid"] }
bytes = "1.9"
bytesize = "1.3"
parking_lot = "0.12"
dashmap = "6.1"
arc-swap = "1.7"
smallvec = "1.13"
futures = "0.3"
async-trait = "0.1.81"
clap = { version = "4.5", features = ["derive", "env", "yaml"] }
config = { version = "0.14", features = ["yaml", "toml"] }
figment = { version = "0.10", features = ["yaml", "toml"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
aws-sdk-s3 = "1.6"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "json", "uuid", "chrono"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager", "script", "streams"] }
minijinja = { version = "2.9", features = ["serde", "loader"] }
termtree = "0.5"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
semver = "1.0"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
x25519-dalek = "2.0"
ed25519-dalek = "2.2"
rand = { version = "0.9", features = ["std", "small_rng"] }
getrandom = "0.2"
zeroize = "1.8"
secrecy = "0.10"
jsonwebtoken = "9.3"
josekit = "0.6"
url = "2.5"
percent-encoding = "2.3"
form_urlencoded = "1.2"
mime = "0.3"
httparse = "1.9"
http = "1.2"
http-body = "1.0"
hyper = { version = "1.3", features = ["full", "http1", "http2", "tcp", "client", "server"] }
tower = { version = "0.5", features = ["util", "layer", "limit", "timeout", "retry", "buffer", "load", "balance"] }
tower-http = { version = "0.6", features = ["add-origin", "cors", "trace", "decompression", "compression", "auth", "classify", "set-header", "request-id", "propagate-header"] }
axum = { version = "0.7", features = ["router", "handler", "extract", "response", "json", "form", "query", "multipart", "ws", "body", "routing", "middleware", "serve", "error", "extension", "http", "json", "body"] }
socket2 = "0.5"
mio = "1"
nix = { version = "0.28", features = ["net", "fs", "process", "term", "signal"] }
libc = "0.2"
tempfile = "3.10"
memmap2 = "0.9"
flate2 = "1"
walkdir = "2.5"
glob = "0.3"
ignore = "0.4"
notify = { version = "6.1", features = ["tokio"] }
inotify = "0.10"
globset = "0.4"
regex = { version = "1.10", features = ["unicode", "perf", "perf-dfa", "perf-literal", "perf-cache"] }
aho-corasick = { version = "1.1", features = ["std", "memchr"] }
memchr = "2.7"
bstr = "1.9"
csv = "1.3"
arrow = { version = "55.0", features = ["array", "compute", "csv", "json", "parquet", "ipc", "flight"] }
parquet = { version = "55.0", features = ["async", "compression-snappy", "compression-zstd", "encryption", "arrow-55"] }
polars = { version = "0.40", features = ["lazy", "csv", "parquet", "json", "ipc", "python", "strings", "temporal", "arrow"] }
petgraph = "0.7"
topo = "0.1"
itertools = "0.13"
indexmap = "2.2"
hashbrown = "0.14"
tinyvec = "1.12"
arrayvec = "0.7"
bitvec = "1.0"
roaring = "0.11"
scc = "3"
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1.7"
digest = "0.10"
generic-array = "0.14"
subtle = "2.5"
subtle-encoding = "0.5"
base64 = "0.23"
base64ct = "1.7"
data-encoding = "2.6"
querystring = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "local-offset", "macros"] }
chrono = { version = "0.4", features = ["serde", "clock", "rkyv"] }
jiff = { version = "0.2", features = ["tz", "serde", "tzdb"] }
ksuid = { version = "0.2", features = ["serde"] }
nanoid = "0.5"
nanoid-dictionary = "0.4"
atomic-waker = "1.1"
event-listener = "5.0"
portable-atomic = "1.6"
crossbeam = { version = "0.8", features = ["alloc"] }
once_cell = "1.19"
lock_api = "0.4"
spin = "0.10"
scopeguard = "1.2"
pin-project = "1.1"
pin-project-lite = "0.2"
slotmap = "1.1"
generational-arena = "0.2"
id-arena = "2"
thunderdome = "0.6"
# yrs for CRDT
yrs = "0.23"
automerge = "0.11"
# WASM runtime: exact pin; first used in P5 (wasmtime per D-P3-5; the guest is a wasm32-unknown-unknown core module wrapped as a component, D-P5-13)
wasmtime = { version = "=50.0.0", features = ["component-model"] }

[workspace.metadata.gsd-pins]
rustc = "1.98.1"
wasmtime = "50.0.0"
wit-bindgen = "0.57.1"
wasm_target = "wasm32-unknown-unknown"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, not abort: the scheduler isolates worker panics; abort would kill the process.
panic = "unwind"
strip = "symbols"

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
