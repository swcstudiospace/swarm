# cargo-deny policy for the Rust workspace. Run it with `bash scripts/ci_cargo_deny.sh` (pinned cargo-deny 0.20.2).
# Baseline: observed on this checkout on 2026-10-28; see .planning/phases/14.2-ci-evidence-and-runner-decision/.

[graph]
# Drops the windows-* and windows_* crates (and their duplicates) that the lock carries for targets nobody builds.
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[advisories]
version = 2
yanked = "deny"
# Six advisories are ignored under D-P23 (user, 2026-10-28), each time-boxed: cargo-deny has no expiry key, so every reason ends in
# `expires YYYY-MM-DD` and scripts/_check_deny_ignores.py (run first by scripts/ci_cargo_deny.sh) fails the job once the date has
# passed or when it lies more than 120 days ahead. Renewing an entry needs a new decision by the user.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained (no vulnerability); it is a direct dependency of gsd-serde, which only calls bincode::serialize/deserialize on Vec<u8>, so nothing in it is reachable as a flaw; fix: move gsd-serde to postcard, wincode or bitcode; expires 2027-01-26" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr 0.3.1 is unmaintained (no vulnerability); it is pulled in only by yrs 0.23.5 (gsd-nexus, gsd-scheduler), our code never names it; fix: a yrs release without smallstr, or replacing yrs; expires 2027-01-26" },
    { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7.46 reads out of bounds when validating archives that contain Rc/Arc; it is compiled in only because the workspace chrono dependency enables chrono's rkyv feature (gsd-proto, gsd-serde), and no crate here uses rkyv::access, rkyv::from_bytes or derives Archive, so the vulnerable path is not reachable; fix: drop the unused rkyv feature from chrono in the workspace Cargo.toml, which removes the crate; expires 2027-01-26" },
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 leaks data between streams that reuse a context via Encoder/Decoder::with_context; it comes from wasmtime-internal-cache (wasmtime 50.0.0, gsd-sandbox), which only calls zstd::encode_all and decode_all, and gsd-sandbox builds its wasmtime Config without enabling the compilation cache, so the zstd code never runs; fix: a wasmtime release that uses zstd 0.14.3 or later; expires 2027-01-26" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.3.0 sets a Vec length past its capacity in Seekable::decompress; that API exists only with zstd-safe's seekable feature, which is not enabled in this build (features: std only), and the crate arrives via wasmtime-internal-cache (wasmtime 50.0.0, gsd-sandbox), whose cache is off, so it is not reachable; fix: a wasmtime release that uses zstd-safe 8.2.0 or later; expires 2027-01-26" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.3.0 exposes uninitialized memory when DCtx::decompress_stream hits a corrupt legacy frame through zstd::stream::write::Decoder; wasmtime-internal-cache (wasmtime 50.0.0, gsd-sandbox) only uses zstd::decode_all, which the advisory lists as not affected, and gsd-sandbox leaves the cache off, so it is not reachable; fix: a wasmtime release that uses zstd-safe 8.2.0 or later; expires 2027-01-26" },
]

[licenses]
version = 2
# Every crate in the lock is covered by this list, via one alternative of its SPDX expression, except webpki-roots (exception below).
# Approved by the user in D-P23 (2026-10-28).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

# webpki-roots (0.26.11 and 1.0.10, both from sqlx-core -> gsd-adapter) is licensed only CDLA-Permissive-2.0 (the Mozilla root
# certificate data). Permissive, but not an OSI licence: approved in D-P23 as an exception scoped to this crate only.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
# 33 crates have 2 to 4 versions in the graph for the two targets (50 in the full lock); "deny" would fail today.
multiple-versions = "warn"
# Workspace path dependencies carry no version requirement; "deny" would fail on 14 workspace crates today.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
